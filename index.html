<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sport Games</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="loading">Cargando…</div>

    <section id="select" hidden>
      <h1>Elegí tu auto</h1>
      <div id="cards"></div>
      <p class="hint">← → para cambiar · Enter para elegir · o hacé clic</p>
    </section>

    <section id="hud" hidden>
      <div id="speedo">
        <span id="speed">0</span><small>km/h</small><b id="gear"></b>
      </div>
      <div id="info">
        <div id="car-name"></div>
        <div>Piso: <span id="surface"></span></div>
        <div>Cámara: <span id="cam-mode"></span></div>
      </div>
      <div id="help">
        W/↑ acelerar · S/↓ frenar/atrás · A/D doblar · Espacio freno de mano · R reubicar · C cámara · 1/2/3 cambiar auto · Esc menú
      </div>
      <div id="fps"></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
